version: "3.8"

services:
  # API service: runs FastAPI (main.py)
  app:
    build: .
    image: hardware-clean-alerts:latest
    working_dir: /app
    volumes:
      # Source code mounted for development
      - ./:/app:rw
      # Persistent SQLite data lives on host (Windows path) and is mounted inside container
      - D:/Leandro/basesdedatos:/opt/scraper:rw
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_TOKEN_FILE=/app/config/telegram.env
      - SCRAPER_DB_PATH=/opt/scraper/data.db
    # API server process
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on: []

  # Runner service: executes the cron-like job (runner.py)
  # This is meant to be triggered by cron (host) or manually via `docker compose run runner`
  runner:
    build: .
    image: hardware-clean-alerts:latest
    working_dir: /app
    volumes:
      # Same code mount for consistency
      - ./:/app:rw
      # Same persistent DB mount
      - D:/Leandro/basesdedatos:/opt/scraper:rw
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_TOKEN_FILE=/app/config/telegram.env
      - SCRAPER_DB_PATH=/opt/scraper/data.db
    # One-off job process
    command: python runner.py
    depends_on: []

# Note: Playwright requires additional setup in Docker (install browsers).
# This compose file expects you to build an image with Playwright installed.
